spring.application.name=rabbitadmin
server.port=8095

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# API HTTP del plugin de management (para listar colas, exchanges y bindings).
# Se prueban en orden; en docker-compose se pasan rabbitmq1 y rabbitmq2.
rabbitmq.management.urls=${RABBITMQ_MGMT_URLS:http://localhost:15672}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
