spring.application.name=kafkaadmin
server.port=8096

# Brokers del cluster (en docker-compose: kafka1:9092,kafka2:9092,kafka3:9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
# Tiempo maximo de espera por cada operacion contra Kafka
kafka.admin.timeout-seconds=15

management.endpoints.web.exposure.include=health,info

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
