spring.application.name=inventario
server.port=8091

spring.datasource.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/inventario_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:Rodrigo2481}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# --- Eureka client ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# --- Eureka metadata ---
eureka.instance.metadata-map.swagger=http://localhost:8091/swagger-ui.html
eureka.instance.metadata-map.health=http://localhost:8091/actuator/health
eureka.instance.metadata-map.metrics=http://localhost:8091/actuator/metrics
eureka.instance.metadata-map.description=MS Inventario - Productos y Stock
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url=http://localhost:8091/actuator/info
eureka.instance.health-check-url=http://localhost:8091/actuator/health
eureka.instance.home-page-url=http://localhost:8091/swagger-ui.html 

management.info.env.enabled=true
info.app.name=MS Inventario
info.app.description=Microservicio de productos y stock
info.app.version=1.0.0
info.app.puerto=8091