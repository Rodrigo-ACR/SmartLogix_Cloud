spring.application.name=envios
server.port=8093

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-envios:5432/envios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.smartlogix=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# --- Eureka client ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# --- Eureka metadata ---
eureka.instance.metadata-map.swagger=http://localhost:8093/swagger-ui.html
eureka.instance.metadata-map.health=http://localhost:8093/actuator/health
eureka.instance.metadata-map.metrics=http://localhost:8093/actuator/metrics
eureka.instance.metadata-map.description=MS Envios - Logistica y trazabilidad
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url=http://localhost:8093/actuator/info
eureka.instance.health-check-url=http://localhost:8093/actuator/health
eureka.instance.home-page-url=http://localhost:8093/swagger-ui.html 

management.info.env.enabled=true
info.app.name=MS Envios
info.app.description=Microservicio de logistica y trazabilidad
info.app.version=1.0.0
info.app.puerto=8093