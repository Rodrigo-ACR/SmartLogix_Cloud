spring.application.name=usuarios

server.port=8094

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-usuarios:5432/usuarios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.pathmatch.use-suffix-pattern=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# --- Eureka client ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# --- Eureka metadata ---
eureka.instance.metadata-map.swagger=http://localhost:8094/swagger-ui.html
eureka.instance.metadata-map.health=http://localhost:8094/actuator/health
eureka.instance.metadata-map.metrics=http://localhost:8094/actuator/metrics
eureka.instance.metadata-map.description=MS Usuarios - Autenticacion y roles
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url=http://localhost:8094/actuator/info
eureka.instance.health-check-url=http://localhost:8094/actuator/health
eureka.instance.home-page-url=http://localhost:8094/swagger-ui.html

# Inicializar datos al arrancar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Info del servicio (visible en /actuator/info) ---
management.info.env.enabled=true
info.app.name=MS Usuarios
info.app.description=Microservicio de autenticacion y roles
info.app.version=1.0.0
info.app.puerto=8094