version: "3.9"

# =====================================================================
# SmartLogix - stack completo
#   * Microservicios Spring Boot + BFF + Eureka + frontend + nginx
#   * RabbitMQ en cluster de 2 nodos (EP2)
#   * Kafka: 3 Zookeeper + 3 brokers + Kafka UI + microservicio kafkaadmin (EV3)
#
# Arranque:   docker compose up -d --build
# Solo Kafka: docker compose up -d zookeeper1 zookeeper2 zookeeper3 kafka1 kafka2 kafka3 kafka-init kafka-ui
# Solo Rabbit: docker compose up -d rabbitmq1 rabbitmq2
# =====================================================================

services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"

  postgres-inventario:
    image: postgres:16
    container_name: postgres-inventario
    restart: always
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  postgres-pedidos:
    image: postgres:16
    container_name: postgres-pedidos
    restart: always
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  postgres-envios:
    image: postgres:16
    container_name: postgres-envios
    restart: always
    environment:
      POSTGRES_DB: envios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  postgres-usuarios:
    image: postgres:16
    container_name: postgres-usuarios
    restart: always
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"

  inventario:
    build: ./inventario
    container_name: inventario
    restart: always
    ports:
      - "8091:8091"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-inventario:5432/inventario_db
      DB_USER: postgres
      DB_PASS: postgres
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: "8091"
      EUREKA_INSTANCE_STATUSPAGEURL: http://localhost:8091/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://localhost:8091/actuator/health
      EUREKA_INSTANCE_HOMEPAGEURL: http://localhost:8091/swagger-ui.html
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_INVENTARIO_REPONER: "${KAFKA_INVENTARIO_REPONER:-true}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      postgres-inventario:
        condition: service_started
      eureka-server:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  pedidos:
    build: ./pedidos
    container_name: pedidos
    restart: always
    ports:
      - "8092:8092"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-pedidos:5432/pedidos_db
      DB_USER: postgres
      DB_PASS: postgres
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: "8092"
      EUREKA_INSTANCE_STATUSPAGEURL: http://localhost:8092/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://localhost:8092/actuator/health
      EUREKA_INSTANCE_HOMEPAGEURL: http://localhost:8092/swagger-ui.html
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      postgres-pedidos:
        condition: service_started
      eureka-server:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  envios:
    build: ./envios
    container_name: envios
    restart: always
    ports:
      - "8093:8093"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-envios:5432/envios_db
      DB_USER: postgres
      DB_PASS: postgres
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: "8093"
      EUREKA_INSTANCE_STATUSPAGEURL: http://localhost:8093/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://localhost:8093/actuator/health
      EUREKA_INSTANCE_HOMEPAGEURL: http://localhost:8093/swagger-ui.html
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_ENVIOS_AUTO_CREAR: "${KAFKA_ENVIOS_AUTO_CREAR:-true}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      postgres-envios:
        condition: service_started
      eureka-server:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  usuarios:
    build: ./usuarios
    container_name: usuarios
    restart: always
    ports:
      - "8094:8094"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      DB_USER: postgres
      DB_PASS: postgres
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: "8094"
      EUREKA_INSTANCE_STATUSPAGEURL: http://localhost:8094/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://localhost:8094/actuator/health
      EUREKA_INSTANCE_HOMEPAGEURL: http://localhost:8094/swagger-ui.html
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      postgres-usuarios:
        condition: service_started
      eureka-server:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  bff:
    build: ./bff
    container_name: bff
    restart: always
    ports:
      - "8085:8085"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: "8085"
      EUREKA_INSTANCE_STATUSPAGEURL: http://localhost:8085/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://localhost:8085/actuator/health
      EUREKA_INSTANCE_HOMEPAGEURL: http://localhost:8085/swagger-ui.html
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      - eureka-server
      - inventario
      - pedidos
      - envios
      - usuarios
      - rabbitadmin
      - kafkaadmin

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - bff

  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend

  # =====================================================================
  # CLUSTER DE RABBITMQ (2 NODOS) - EP2
  # =====================================================================
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "SMARTLOGIX_CLUSTER_COOKIE"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: always
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "SMARTLOGIX_CLUSTER_COOKIE"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    depends_on:
      - rabbitmq1
    # Espera a que rabbitmq1 este arriba, y se une al cluster como
    # segundo nodo usando el mismo Erlang cookie (clave compartida
    # que permite a los nodos de RabbitMQ reconocerse entre si).
    command: >
      bash -c "
      (rabbitmq-server &) ;
      sleep 15 ;
      rabbitmqctl stop_app ;
      rabbitmqctl join_cluster rabbit@rabbitmq1 ;
      rabbitmqctl start_app ;
      tail -f /dev/null
      "

  # =====================================================================
  # MICROSERVICIO ADMINISTRADOR DE RABBITMQ - EP2
  # =====================================================================
  rabbitadmin:
    build: ./rabbitadmin
    container_name: rabbitadmin
    restart: always
    ports:
      - "8095:8095"
    environment:
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_MGMT_URLS: http://rabbitmq1:15672,http://rabbitmq2:15672
      EUREKA_URL: http://eureka-server:8761/eureka
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      - rabbitmq1
      - rabbitmq2
      - eureka-server

  # =====================================================================
  # CLUSTER DE KAFKA - EV3
  #   3 nodos Zookeeper (quorum: tolera la caida de 1) +
  #   3 brokers (factor de replicacion 3, min.insync.replicas 2)
  # =====================================================================
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper1
    hostname: zookeeper1
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper2
    hostname: zookeeper2
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper3
    hostname: zookeeper3
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"

  # Listeners: INTERNAL (kafkaN:9092) lo usan los contenedores; EXTERNAL (localhost:1909N)
  # permite conectarse desde la maquina anfitriona (IDE, pruebas locales). En AWS el
  # puerto externo NO se abre en el security group.
  kafka1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka1
    hostname: kafka1
    restart: always
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka2
    hostname: kafka2
    restart: always
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "19093:19093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka3
    hostname: kafka3
    restart: always
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "19094:19094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Job de una sola ejecucion: crea los topicos cuando los 3 brokers estan sanos.
  # Los microservicios esperan a que termine (service_completed_successfully).
  #   - smartlogix.pedidos.eventos    : 3 particiones, 3 replicas, retencion 7 dias, cleanup delete
  #   - smartlogix.logistica.eventos  : 3 particiones, 3 replicas, retencion 3 dias, cleanup compact,delete
  #   - *.DLT                         : mensajes que agotaron los reintentos (retencion 30 dias)
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[kafka-init] Creando topicos..."
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic smartlogix.pedidos.eventos --partitions 3 --replication-factor 3 --config cleanup.policy=delete --config retention.ms=604800000 --config min.insync.replicas=2
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic smartlogix.logistica.eventos --partitions 3 --replication-factor 3 --config retention.ms=259200000 --config min.insync.replicas=2
        kafka-configs --bootstrap-server kafka1:9092 --alter --entity-type topics --entity-name smartlogix.logistica.eventos --add-config "cleanup.policy=[compact,delete]"
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic smartlogix.pedidos.eventos.DLT --partitions 3 --replication-factor 3 --config retention.ms=2592000000 --config min.insync.replicas=2
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic smartlogix.logistica.eventos.DLT --partitions 3 --replication-factor 3 --config retention.ms=2592000000 --config min.insync.replicas=2
        echo "[kafka-init] Topicos existentes:"
        kafka-topics --bootstrap-server kafka1:9092 --describe

  # Kafka UI: administrar brokers, topicos, particiones, mensajes y consumer groups.
  # Usuario/clave configurables con KAFKA_UI_USER / KAFKA_UI_PASSWORD (por defecto admin / smartlogix).
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: always
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlogix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "${KAFKA_UI_USER:-admin}"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD:-smartlogix}"
      JAVA_OPTS: "-Xms64m -Xmx256m"

  # =====================================================================
  # MICROSERVICIO ADMINISTRADOR DE KAFKA - EV3
  # =====================================================================
  kafkaadmin:
    build: ./kafkaadmin
    container_name: kafkaadmin
    restart: always
    ports:
      - "8096:8096"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      EUREKA_URL: http://eureka-server:8761/eureka
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_started
